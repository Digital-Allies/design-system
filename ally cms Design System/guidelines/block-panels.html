<!-- @dsCard group="Components" viewport="700x500" name="Block Panels" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:var(--space-6);background:var(--cms-bg);font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)">
<div>
<h3 style="margin:0 0 var(--space-4) 0;font-size:var(--fs-base);font-weight:700;color:var(--color-fg)">Block List</h3>
<div style="background:var(--cms-block-list-bg);border:var(--border-1);border-radius:var(--radius-2);overflow:hidden">
<div style="padding:var(--space-4);border-bottom:var(--border-1);background:var(--cms-item-active-bg);cursor:pointer"><div style="font-weight:600;font-size:var(--fs-sm);color:var(--color-fg);margin-bottom:var(--space-1)">Hero Section</div><p style="margin:0;font-size:var(--fs-xs);color:var(--color-fg-soft)">Type: hero</p></div>
<div style="padding:var(--space-4);border-bottom:var(--border-1);cursor:pointer;transition:background 200ms"><div style="font-weight:600;font-size:var(--fs-sm);color:var(--color-fg);margin-bottom:var(--space-1)">Text Block</div><p style="margin:0;font-size:var(--fs-xs);color:var(--color-fg-soft)">Type: richtext</p></div>
<div style="padding:var(--space-4);cursor:pointer;transition:background 200ms"><div style="font-weight:600;font-size:var(--fs-sm);color:var(--color-fg);margin-bottom:var(--space-1)">Contact Form</div><p style="margin:0;font-size:var(--fs-xs);color:var(--color-fg-soft)">Type: contact</p></div>
</div>
</div>
<div>
<h3 style="margin:0 0 var(--space-4) 0;font-size:var(--fs-base);font-weight:700;color:var(--color-fg)">Block Buttons</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ Hero</button>
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ Text</button>
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ Products</button>
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ CTA</button>
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ Contact</button>
<button style="padding:var(--space-3);background:var(--cms-block-btn-bg);border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg)">+ Testimonials</button>
</div>
</div>
</body>
</html>
