<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:var(--space-6)}
.space-scale{display:flex;flex-direction:column;gap:var(--space-6)}
.space-sample{display:flex;align-items:flex-end;gap:var(--space-4)}
.space-bar{background:var(--color-accent);border-radius:var(--radius-1)}
.space-label{font-size:var(--fs-xs);font-weight:600;min-width:80px}
</style>
</head>
<body>
<!-- @dsCard group="Spacing" viewport="700x280" name="Spacing Scale" -->
<div class="space-scale">
<div class="space-sample"><div class="space-label">8px (space-2)</div><div class="space-bar" style="width:20px;height:8px"></div></div>
<div class="space-sample"><div class="space-label">12px (space-3)</div><div class="space-bar" style="width:20px;height:12px"></div></div>
<div class="space-sample"><div class="space-label">16px (space-4)</div><div class="space-bar" style="width:20px;height:16px"></div></div>
<div class="space-sample"><div class="space-label">20px (space-5)</div><div class="space-bar" style="width:20px;height:20px"></div></div>
<div class="space-sample"><div class="space-label">24px (space-6)</div><div class="space-bar" style="width:20px;height:24px"></div></div>
<div class="space-sample"><div class="space-label">32px (space-8)</div><div class="space-bar" style="width:20px;height:32px"></div></div>
</div>
</body>
</html>
