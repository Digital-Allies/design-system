<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AllyCMS Projects" description="Project management and tracking" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="display:flex;height:100vh;background:var(--cms-bg);font-family:var(--font-body);color:var(--color-fg)">
<aside style="width:280px;background:var(--cms-sidebar-bg);border-right:var(--border-1);overflow-y:auto;padding:var(--space-6)">
<div style="margin-bottom:var(--space-8)"><div style="font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--color-fg-soft);margin-bottom:var(--space-6)">ally CMS</div>
<nav style="display:flex;flex-direction:column;gap:var(--space-2)"><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Dashboard</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Pages</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Collections</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Press Office</a><a href="#" style="padding:var(--space-3) var(--space-4);background:var(--cms-item-active-bg);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-weight:600;font-size:var(--fs-sm)">Projects</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Research</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms">Settings</a></nav></div>
</aside>
<main style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<header style="background:var(--cms-header-bg);border-bottom:var(--border-1);padding:var(--space-4) var(--space-6);display:flex;justify-content:space-between;align-items:center">
<div><h1 style="margin:0;font-size:var(--fs-lg);font-weight:700">Projects</h1><p style="margin:var(--space-1) 0 0 0;font-size:var(--fs-xs);color:var(--color-fg-soft)">Organize and track ongoing work</p></div>
<button style="padding:var(--space-2) var(--space-4);background:var(--color-accent);color:white;border:none;border-radius:var(--radius-1);cursor:pointer;font-weight:600;font-size:var(--fs-sm)" onclick="{{ addProject }}">+ New Project</button>
</header>
<div style="flex:1;overflow-y:auto;padding:var(--space-6);background:var(--cms-editor-bg)">
<div style="max-width:1200px">
<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:var(--space-6)">
<sc-for list="{{ projects }}" as="project" hint-placeholder-count="3">
<div style="background:var(--cms-block-list-bg);border:var(--border-1);border-radius:var(--radius-2);padding:var(--space-4);cursor:pointer;transition:all 200ms" onmouseover="this.style.boxShadow='0 8px 16px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow='none'">
<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:var(--space-3)"><h3 style="margin:0;font-weight:700;font-size:var(--fs-sm);color:var(--color-fg)">{{ project.name }}</h3><span style="font-size:var(--fs-xs);font-weight:600;padding:4px 8px;background:var(--color-bg-alt);border-radius:var(--radius-1)">{{ project.status }}</span></div>
<p style="margin:0 0 var(--space-3) 0;font-size:var(--fs-xs);color:var(--color-fg-soft);line-height:1.4">{{ project.description }}</p>
<div style="margin-bottom:var(--space-3)"><p style="margin:0 0 var(--space-1) 0;font-size:var(--fs-xs);font-weight:600;color:var(--color-fg-soft)">Progress</p><div style="width:100%;height:6px;background:var(--color-bg-alt);border-radius:var(--radius-1);overflow:hidden"><div style="height:100%;background:var(--color-accent)" data-progress="{{ project.progress }}"></div></div></div>
<p style="margin:0 0 var(--space-2) 0;font-size:var(--fs-xs);color:var(--color-fg-soft)">Due: {{ project.dueDate }}</p>
<div style="display:flex;gap:var(--space-2)"><button style="flex:1;padding:var(--space-2);background:transparent;border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600">Edit</button><button style="flex:1;padding:var(--space-2);background:transparent;border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);color:var(--color-signal)">Delete</button></div>
</div>
</sc-for>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;900px&quot;}}">
class Component extends DCLogic {
  state = {
    projects: [
      { id: 'p1', name: 'Mobile Responsive Design', description: 'Update all admin templates for mobile and tablet', status: 'In Progress', progress: 65, dueDate: 'Aug 15, 2026' },
      { id: 'p2', name: 'Supabase Integration', description: 'Wire CMS to database and real-time sync', status: 'In Progress', progress: 40, dueDate: 'Aug 30, 2026' },
      { id: 'p3', name: 'Dark Mode Implementation', description: 'Full dark mode across all admin pages', status: 'Planning', progress: 0, dueDate: 'Sep 10, 2026' }
    ]
  };

  componentDidMount() {
    document.querySelectorAll('[data-progress]').forEach(bar => {
      const progress = parseInt(bar.getAttribute('data-progress'), 10);
      bar.style.width = progress + '%';
    });
  }

  renderVals() {
    return {
      projects: this.state.projects,
      addProject: () => {
        const newProject = { id: 'p' + Date.now(), name: 'New Project', description: '', status: 'Planning', progress: 0, dueDate: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString() };
        this.setState(s => ({ projects: [newProject, ...s.projects] }));
      }
    };
  }
}

</script>
</body>
</html>
