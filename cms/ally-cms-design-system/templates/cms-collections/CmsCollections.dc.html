<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AllyCMS Collections" description="Products and collections manager" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="display:flex;height:100vh;background:var(--cms-bg);font-family:var(--font-body);color:var(--color-fg)">
<aside style="width:280px;background:var(--cms-sidebar-bg);border-right:var(--border-1);overflow-y:auto;padding:var(--space-6)">
<div style="margin-bottom:var(--space-8)"><h2 style="font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);margin:0 0 var(--space-4) 0;color:var(--color-fg-soft)">Collections</h2><div style="display:flex;flex-direction:column;gap:var(--space-2)">{{ collections }}</div></div>
<button style="width:100%;padding:var(--space-3) var(--space-4);background:var(--color-accent);color:white;border:none;border-radius:var(--radius-1);cursor:pointer;font-weight:600;font-size:var(--fs-sm)" onclick="{{ addCollection }}">+ New Collection</button>
</aside>
<main style="flex:1;display:flex;flex-direction:column">
<header style="background:var(--cms-header-bg);border-bottom:var(--border-1);padding:var(--space-4) var(--space-6);display:flex;justify-content:space-between;align-items:center">
<div><h1 style="margin:0;font-size:var(--fs-lg);font-weight:700">{{ currentCollectionName }}</h1><p style="margin:var(--space-1) 0 0 0;font-size:var(--fs-xs);color:var(--color-fg-soft)">{{ productCount }} products</p></div>
<button style="padding:var(--space-2) var(--space-4);background:var(--color-accent);color:white;border:none;border-radius:var(--radius-1);cursor:pointer;font-weight:600;font-size:var(--fs-sm)" onclick="{{ addProduct }}">+ Add Product</button>
</header>
<div style="flex:1;display:flex;overflow:hidden">
<section style="flex:1;overflow-y:auto;padding:var(--space-6);background:var(--cms-editor-bg)">
<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:var(--space-4)">{{ products }}</div>
</section>
<aside style="width:320px;background:var(--cms-panel-bg);border-left:var(--border-1);padding:var(--space-6);overflow-y:auto">
<h3 style="margin:0 0 var(--space-4) 0;font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide)">Settings</h3>
<div style="display:flex;flex-direction:column;gap:var(--space-4)">
<label style="display:flex;flex-direction:column;gap:var(--space-2);font-size:var(--fs-xs)"><span style="font-weight:600">Collection Name</span><input type="text" value="{{ currentCollectionName }}" style="background:var(--cms-input-bg);border:var(--border-1);padding:var(--space-2);border-radius:var(--radius-1);font-family:var(--font-body);font-size:var(--fs-base);box-sizing:border-box" /></label>
<label style="display:flex;flex-direction:column;gap:var(--space-2);font-size:var(--fs-xs)"><span style="font-weight:600">Description</span><textarea style="background:var(--cms-input-bg);border:var(--border-1);padding:var(--space-2);border-radius:var(--radius-1);font-family:var(--font-body);font-size:var(--fs-base);min-height:100px;box-sizing:border-box"></textarea></label>
<button style="padding:var(--space-3);background:var(--color-signal);color:white;border:none;border-radius:var(--radius-1);cursor:pointer;font-weight:600;font-size:var(--fs-sm)">Delete Collection</button>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;900px&quot;}}">
class Component extends DCLogic {
  state = {
    currentCollectionId: 'chairs',
    collections: [
      { id: 'chairs', name: 'Chairs', count: 4 },
      { id: 'shelving', name: 'Shelving', count: 3 },
      { id: 'lamps', name: 'Lamps', count: 2 }
    ],
    products: [
      { id: 'p1', name: 'Peacock Chair', price: 1450, image: 'chair1.jpg', sku: 'AF-CH-001' },
      { id: 'p2', name: 'Rattan Lounge', price: 145, image: 'chair2.jpg', sku: 'AF-CH-002' },
      { id: 'p3', name: 'Blue MCM Chair', price: 595, image: 'chair3.jpg', sku: 'AF-CH-003' },
      { id: 'p4', name: 'Rattan Armchair', price: 195, image: 'chair4.jpg', sku: 'AF-CH-004' }
    ]
  };

  renderVals() {
    const currentCollection = this.state.collections.find(c => c.id === this.state.currentCollectionId) || this.state.collections[0];
    
    return {
      currentCollectionName: currentCollection.name,
      productCount: this.state.products.length,
      collections: this.state.collections.map(c =>
        `<div style="padding:var(--space-3);background:${c.id === this.state.currentCollectionId ? 'var(--cms-item-active-bg)' : 'transparent'};border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-sm);font-weight:${c.id === this.state.currentCollectionId ? '700' : '500'}" onclick="window.__selectCollection('${c.id}')">${c.name}<span style="font-size:var(--fs-xs);color:var(--color-fg-soft);display:block;margin-top:var(--space-1)">${c.count} items</span></div>`
      ).join(''),
      products: this.state.products.map(p =>
        `<div style="background:var(--cms-block-list-bg);border:var(--border-1);border-radius:var(--radius-2);overflow:hidden;transition:all 200ms;cursor:pointer" onmouseover="this.style.boxShadow='0 8px 16px rgba(0,0,0,0.1)'" onmouseout="this.style.boxShadow='none'">
          <div style="aspect-ratio:1;background:var(--color-bg-alt);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--color-fg-soft)">Image</div>
          <div style="padding:var(--space-3)">
            <p style="margin:0 0 var(--space-1) 0;font-weight:600;font-size:var(--fs-sm)">${p.name}</p>
            <p style="margin:0 0 var(--space-2) 0;font-size:var(--fs-xs);color:var(--color-fg-soft)">SKU: ${p.sku}</p>
            <p style="margin:0;font-weight:700;color:var(--color-accent)">$${p.price.toLocaleString()}</p>
            <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2)">
              <button style="flex:1;padding:var(--space-2);background:transparent;border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);font-weight:600">Edit</button>
              <button style="flex:1;padding:var(--space-2);background:transparent;border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-xs);color:var(--color-signal)">Delete</button>
            </div>
          </div>
        </div>`
      ).join(''),
      addCollection: () => {
        const newCollection = { id: 'c' + Date.now(), name: 'New Collection', count: 0 };
        this.setState(s => ({ collections: [...s.collections, newCollection], currentCollectionId: newCollection.id }));
      },
      addProduct: () => {
        alert('Product creation UI would go here');
      }
    };
  }

  componentDidMount() {
    window.__selectCollection = (collectionId) => this.setState({ currentCollectionId: collectionId });
  }
}

</script>
</body>
</html>
