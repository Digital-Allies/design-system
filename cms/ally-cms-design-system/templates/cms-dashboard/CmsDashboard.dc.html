<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AllyCMS Dashboard" description="Main admin dashboard with overview and stats" -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="display:flex;height:100vh;background:var(--cms-bg);font-family:var(--font-body);color:var(--color-fg)">
<aside style="width:280px;background:var(--cms-sidebar-bg);border-right:var(--border-1);overflow-y:auto;padding:var(--space-6)">
<div style="margin-bottom:var(--space-8)"><div style="font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--color-fg-soft);margin-bottom:var(--space-6)">ally CMS</div>
<nav style="display:flex;flex-direction:column;gap:var(--space-2)"><a href="#" style="padding:var(--space-3) var(--space-4);background:var(--cms-item-active-bg);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-weight:600;font-size:var(--fs-sm)">Dashboard</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms" onmouseover="this.style.background='var(--cms-item-active-bg)'" onmouseout="this.style.background='transparent'">Pages</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms" onmouseover="this.style.background='var(--cms-item-active-bg)'" onmouseout="this.style.background='transparent'">Collections</a><a href="#" style="padding:var(--space-3) var(--space-4);border-radius:var(--radius-1);text-decoration:none;color:var(--color-fg);font-size:var(--fs-sm);transition:background 200ms" onmouseover="this.style.background='var(--cms-item-active-bg)'" onmouseout="this.style.background='transparent'">Settings</a></nav></div>
<div style="margin-top:auto;padding-top:var(--space-6);border-top:var(--border-1)"><div style="font-size:var(--fs-xs);color:var(--color-fg-soft);margin-bottom:var(--space-3)">User@example.com</div><button style="width:100%;padding:var(--space-2) var(--space-4);background:transparent;border:var(--border-1);border-radius:var(--radius-1);cursor:pointer;font-size:var(--fs-sm)">Sign out</button></div>
</aside>
<main style="flex:1;display:flex;flex-direction:column;overflow:hidden">
<header style="background:var(--cms-header-bg);border-bottom:var(--border-1);padding:var(--space-4) var(--space-6)"><h1 style="margin:0;font-size:var(--fs-lg);font-weight:700">Dashboard</h1></header>
<div style="flex:1;overflow-y:auto;padding:var(--space-6)">
<div style="max-width:1200px">
<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:var(--space-6);margin-bottom:var(--space-8)">
<sc-for list="{{ stats }}" as="stat" hint-placeholder-count="4">
<div style="background:var(--cms-block-list-bg);border:var(--border-1);padding:var(--space-6);border-radius:var(--radius-2)">
<p style="margin:0 0 var(--space-2) 0;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--color-fg-soft);font-weight:600">{{ stat.label }}</p>
<p style="margin:0;font-size:var(--fs-4xl);font-weight:700;color:var(--color-accent)">{{ stat.value }}</p>
</div>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr;gap:var(--space-6)">
<div>
<h2 style="margin:0 0 var(--space-4) 0;font-size:var(--fs-lg);font-weight:700">Recent Pages</h2>
<div style="background:var(--cms-block-list-bg);border:var(--border-1);border-radius:var(--radius-2);overflow:hidden">
<sc-for list="{{ recentPages }}" as="page" hint-placeholder-count="3">
<div style="padding:var(--space-4);border-bottom:var(--border-1);display:flex;justify-content:space-between;align-items:center">
<div><p style="margin:0 0 var(--space-1) 0;font-weight:600;font-size:var(--fs-sm)">{{ page.title }}</p><p style="margin:0;font-size:var(--fs-xs);color:var(--color-fg-soft)">{{ page.updatedAt }}</p></div>
<span style="font-size:var(--fs-xs);font-weight:600;padding:4px 8px;background:var(--color-bg-alt);border-radius:var(--radius-1)">{{ page.status }}</span>
</div>
</sc-for>
</div>
</div>

<div>
<h2 style="margin:0 0 var(--space-4) 0;font-size:var(--fs-lg);font-weight:700">Quick Stats</h2>
<div style="background:var(--cms-block-list-bg);border:var(--border-1);border-radius:var(--radius-2);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)">
<div><p style="margin:0 0 var(--space-2) 0;font-size:var(--fs-xs);color:var(--color-fg-soft);font-weight:600">Site Health</p><div style="width:100%;height:8px;background:var(--color-bg-alt);border-radius:var(--radius-1);overflow:hidden"><div style="width:92%;height:100%;background:var(--color-accent)"></div></div><p style="margin:var(--space-2) 0 0 0;font-size:var(--fs-xs);color:var(--color-fg-soft)">92% complete</p></div>
<div><p style="margin:0 0 var(--space-2) 0;font-size:var(--fs-xs);color:var(--color-fg-soft);font-weight:600">Storage Used</p><p style="margin:0;font-size:var(--fs-lg);font-weight:700">2.4 GB / 10 GB</p></div>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;900px&quot;}}">
class Component extends DCLogic {
  state = {
    stats: [
      { label: 'Published Pages', value: '12' },
      { label: 'Draft Pages', value: '3' },
      { label: 'Total Visitors', value: '2,847' },
      { label: 'This Month', value: '+24%' }
    ],
    recentPages: [
      { title: 'Home', updatedAt: '2 hours ago', status: 'Published' },
      { title: 'About', updatedAt: '1 day ago', status: 'Published' },
      { title: 'Services', updatedAt: '3 days ago', status: 'Draft' }
    ]
  };

  renderVals() {
    return {
      stats: this.state.stats,
      recentPages: this.state.recentPages
    };
  }
}

</script>
</body>
</html>
