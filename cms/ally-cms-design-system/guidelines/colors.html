<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:var(--space-6)}
.color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-6)}
.color-swatch{display:flex;flex-direction:column}
.swatch{width:100%;height:120px;border:var(--border-1);margin-bottom:var(--space-3);border-radius:var(--radius-1)}
.swatch-label{font-size:var(--fs-xs);font-weight:600;margin-bottom:var(--space-2)}
.swatch-value{font-size:var(--fs-xs);color:var(--color-fg-soft);font-family:var(--font-mono)}
</style>
</head>
<body>
<!-- @dsCard group="Colors" viewport="700x400" name="Primary Colors" -->
<div class="color-grid">
<div class="color-swatch">
<div class="swatch-label">Signal Red</div>
<div class="swatch" style="background:#C5301A"></div>
<div class="swatch-value">#C5301A</div>
</div>
<div class="color-swatch">
<div class="swatch-label">Pulse Blue</div>
<div class="swatch" style="background:#3A7BD5"></div>
<div class="swatch-value">#3A7BD5</div>
</div>
<div class="color-swatch">
<div class="swatch-label">Light Pink</div>
<div class="swatch" style="background:#FADEEB"></div>
<div class="swatch-value">#FADEEB</div>
</div>
<div class="color-swatch">
<div class="swatch-label">Pulse Blue Dark (AA Contrast)</div>
<div class="swatch" style="background:#1D5FAD"></div>
<div class="swatch-value">#1D5FAD</div>
</div>
</div>
</body>
</html>
