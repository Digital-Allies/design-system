<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
body{padding:var(--space-6);display:flex;gap:var(--space-6);flex-wrap:wrap}
.demo-item{flex:1;min-width:200px}
</style>
</head>
<body>
<!-- @dsCard group="Components" viewport="700x240" name="Core Components" -->
<div class="demo-item">
<h3 style="font-size:var(--fs-sm);color:var(--color-fg-soft);text-transform:uppercase;letter-spacing:var(--tracking-wider);margin-bottom:var(--space-3)">Button</h3>
<div style="display:flex;gap:var(--space-3);flex-wrap:wrap">
<button style="padding:8px 16px;background:var(--color-accent);color:#fff;border:var(--border-1);border-radius:var(--radius-1);font-family:var(--font-body);font-weight:600;cursor:pointer">Primary</button>
<button style="padding:8px 16px;background:var(--color-bg-alt);border:var(--border-1);border-radius:var(--radius-1);font-family:var(--font-body);font-weight:600;cursor:pointer">Secondary</button>
<button style="padding:8px 16px;background:transparent;border:var(--border-1);border-radius:var(--radius-1);font-family:var(--font-body);font-weight:600;cursor:pointer">Outline</button>
</div>
</div>

<div class="demo-item">
<h3 style="font-size:var(--fs-sm);color:var(--color-fg-soft);text-transform:uppercase;letter-spacing:var(--tracking-wider);margin-bottom:var(--space-3)">Input</h3>
<input type="text" placeholder="Text input" style="padding:10px 12px;width:100%;border:var(--border-1);border-radius:var(--radius-1);font-family:var(--font-body);font-size:var(--fs-base)">
</div>

<div class="demo-item">
<h3 style="font-size:var(--fs-sm);color:var(--color-fg-soft);text-transform:uppercase;letter-spacing:var(--tracking-wider);margin-bottom:var(--space-3)">Card</h3>
<div style="background:var(--color-bg);border:var(--border-1);padding:var(--space-4);border-radius:var(--radius-1)">
<p style="margin:0;font-size:var(--fs-sm);color:var(--color-fg-muted)">Card content goes here</p>
</div>
</div>
</body>
</html>
